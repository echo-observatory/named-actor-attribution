name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes no major-version tags
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Run the tests
        run: uv run pytest
